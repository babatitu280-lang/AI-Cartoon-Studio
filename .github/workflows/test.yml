name: AI Cartoon Studio

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Get project files
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install FFmpeg and Blender
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg blender

      - name: Check Python files
        run: python -m compileall -q studio

      - name: Run studio checks
        run: python -m studio.check

      - name: Test episode script
        run: python -m studio.test_script

      - name: Test drawing
        run: python -m studio.test_drawing

      - name: Test video builder
        run: python -m studio.test_video_builder

      - name: Test character compositor
        run: python -m studio.test_compositor

      - name: Test character animation
        run: python -m studio.test_character_animation

      - name: Test frame renderer
        run: python -m studio.test_frame_renderer

      - name: Test scene animator
        run: python -m studio.test_scene_animator

      - name: Render 3D kitchen
        run: blender --background --python studio/create_kitchen.py

      - name: Save generated files
        uses: actions/upload-artifact@v4
        with:
          name: cartoon-studio-prototype
          path: |
            test_animation.mp4
            /tmp/cartoon_kitchen.png
